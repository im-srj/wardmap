[package]
name = "cartograph"
version = "0.1.0"
description = "A modern, actively-maintained GUI for Nmap"
edition = "2021"

[lib]
name = "cartograph_lib"
path = "src/lib.rs"

[[bin]]
name = "cartograph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
simple-dns = "0.12"
quick-xml = "0.42.0"
shell-words = "1.1.1"
tauri-plugin-dialog = "2"

# openpty/setsid so nmap gets a controlling terminal (see runner.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
