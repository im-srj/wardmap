[package]
name = "cartograph"
version = "0.1.0"
description = "A modern, actively-maintained GUI for Nmap"
edition = "2021"

[lib]
name = "cartograph_lib"
path = "src/lib.rs"

[[bin]]
name = "cartograph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
